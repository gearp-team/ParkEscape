org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 공모전 제출 파일명: ./gradlew copyReleaseApk → apk/<teamName>_<appName>_release.apk
pleos.teamName=GearP
pleos.appName=ParkEscape

# true면 Vehicle·NaviHelper·주행 규제를 Fake 데이터로 대체한다(SDK·에뮬레이터 장애 시 시연용).
pleos.useFakeSdk=false

# 주행 중 안내 한 줄 화면(DO 선언) 기능 플래그. 10/28 설명회에서 공식 허용될 때만 true(기획 F1).
pleos.drivingNotice=false
